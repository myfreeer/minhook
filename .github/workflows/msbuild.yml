name: Build

on:
  workflow_dispatch:
  push:
    branches: [ "master", "fork" ]
  pull_request:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: build/VC17/MinHookVC17.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Win32
        # Add additional options to the MSBuild command line here (like platform or verbosity level).
        # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="Win32" ${{ env.SOLUTION_FILE_PATH }}

      - name: Build x64
        # Add additional options to the MSBuild command line here (like platform or verbosity level).
        # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform="x64" ${{ env.SOLUTION_FILE_PATH }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir "${{ runner.temp }}/artifacts"
          mv "build/VC17/bin/${{ env.BUILD_CONFIGURATION }}" "${{ runner.temp }}/artifacts/bin"
          mv "build/VC17/lib/${{ env.BUILD_CONFIGURATION }}" "${{ runner.temp }}/artifacts/lib"
          cp -r include "${{ runner.temp }}/artifacts/include"

      - name: Package bin
        uses: actions/upload-artifact@v4
        with:
          name: MinHook_bin
          path: |
            ${{ runner.temp }}/artifacts/bin/
            ${{ runner.temp }}/artifacts/include/

      - name: Package lib
        uses: actions/upload-artifact@v4
        with:
          name: MinHook_lib
          path: |
            ${{ runner.temp }}/artifacts/lib/
            ${{ runner.temp }}/artifacts/include/

  mingw:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2 MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja

      - name: Build and test CMake static
        run: |
          cmake -S . -B build-mingw-static -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMINHOOK_BUILD_TESTS=ON
          cmake --build build-mingw-static --verbose
          ctest --test-dir build-mingw-static --output-on-failure

      - name: Build CMake shared and verify imports
        run: |
          cmake -S . -B build-mingw-shared -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON
          cmake --build build-mingw-shared --verbose
          dll="$(find build-mingw-shared -maxdepth 1 -type f -iname 'minhook*.dll' -print -quit)"
          test -n "$dll"
          imports="$(objdump -p "$dll" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          test "$imports" = "ntdll.dll"

      - name: Build legacy MinGW makefile and verify imports
        run: |
          make -f build/MinGW/Makefile clean
          make -f build/MinGW/Makefile
          imports="$(objdump -p MinHook.dll | sed -n 's/^[[:space:]]*DLL Name: //p' | tr -d '\r' | tr '[:upper:]' '[:lower:]' | sort -u)"
          test "$imports" = "ntdll.dll"
